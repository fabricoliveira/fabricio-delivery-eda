x-common-env: &common_env
  environment:
    LOG_LEVEL: "DEBUG"
    PYTHONUNBUFFERED: "1"
    SQLALCHEMY_LOG_LEVEL: "INFO"
    PIKA_LOG_LEVEL: "INFO"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: fabricio_delivery_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fabricio_delivery_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: 1234
      RABBITMQ_QUEUE: fabricio_delivery_queue
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    <<: *common_env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rabbitmq
      RABBITMQ_PW: 1234
      RABBITMQ_QUEUE: fabricio_delivery_queue
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: fabricio_delivery_db
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app:delegated
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8081"
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8081" ]
    restart: unless-stopped

  worker:
    build: .
    <<: *common_env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rabbitmq
      RABBITMQ_PW: 1234
      RABBITMQ_QUEUE: fabricio_delivery_queue
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: fabricio_delivery_db
    volumes:
      - .:/app:delegated
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: [ "python", "-m", "app.src.services.queue_consumer_service" ]
    restart: unless-stopped

volumes:
  postgres-data: { }
